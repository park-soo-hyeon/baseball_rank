<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <script>
        const jsonUrl = 'https://prof-jwchi.github.io/kopo-front2026/Json/baseball.json';
        let jsonData = [];
        let team = "";

        fetch(jsonUrl)
        .then(response => {
            return response.json();
        })
        .then(data => {
            jsonData = data.list;
            console.log(jsonData);

            for(let i=0; i<jsonData.length; i++)
            {
                team =
                "<tr>"
                    + "<td>" + jsonData[i].rank.rank + "</td>"
                    + "<td>" + "<img src='" + jsonData[i].imageUrl + "'>" 
                        + jsonData[i].shortName + "</td>"
                    + "<td>" + jsonData[i].rank.game + "</td>"
                    + "<td>" + jsonData[i].rank.win + "</td>"
                    + "<td>" + jsonData[i].rank.draw + "</td>"
                    + "<td>" + jsonData[i].rank.loss + "</td>"
                    + "<td>" + jsonData[i].rank.wpct + "</td>"
                    + "<td>" + jsonData[i].rank.gb + "</td>"
                    + "<td>" + jsonData[i].rank.streak + "</td>"
                + "</tr>";

                document.getElementById("tbody").innerHTML += team;
            };
        })
        .catch(error => {
            console.error('json 파일 가져오기 실패', error)
        })
    </script>

    <style>
        body {
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: 0;
            position: relative;
            margin: 0;
            padding: 0;
            font-family: \\B3CB\C6C0, dotum, sans-serif;
            color: #000; 
        }
        div {
            display: block;
            unicode-bidi: isolate;
            font-family: Helvetica Neue, Apple SD Gothic Neo, Malgun Gothic, "\B9D1\C740 \ACE0\B515", dotum, \\B3CB\C6C0, sans-serif;
        }
        h4 {
            margin-block-start: 1.33em;
            margin-block-end: 1.33em;
            margin-inline-start: 0px;
            margin-inline-end: 0px;
            font-weight: bold;
            unicode-bidi: isolate;
        }

        .rank_box {
            position: relative;
            width: 1100px;
            margin: 0 auto;
        }
        
        .rank_title {
            display: block;
            padding-bottom: 14px;
            font-size: 18px;           
        }


        .rank_table {
            overflow: hidden;
            width: 100%;
            border-spacing: 0;
            table-layout: fixed;
        }
        .thead {
            position: relative;
            border-top: 1px solid #494949;
            padding-top: 43px;
            background-color: #f7f7f7;
            box-sizing: border-box;
        }
        tbody {
            height: 44px;
            border-bottom: 1px solid #f4f4f4;
            font-size: 13px;
            text-align: center;
            box-sizing: border-box;
            overflow-y: auto;
            border-top: 1px solid #ededed;
            border-bottom: 1px solid #eaeaea;
            background-color: #fff;
            font-family: -apple-system, SF Pro Display, Apple SD Gothic Neo, sans-serif;
        }
        tr {
            border-color: inherit;
        }

        img {
            display: inline-block;
            overflow: hidden;
            padding-right: 10px;
            vertical-align: top;
            text-overflow: ellipsis;
            max-width: 100%;
            box-sizing: border-box;
        }
        
    </style>
</head>
<body>
    <div class="rank_box">
        <h4 class="rank_title">종합 순위</h4>
        <div class="rank_table">
            <table>
                <thead class="thead">
                    <tr>
                        <th>순위</th> 
                        <th>팀</th>
                        <th>경기</th> 
                        <th>승</th> 
                        <th>무</th> 
                        <th>패</th>
                        <th>승률</th> 
                        <th>게임차</th> 
                        <th>연속</th>
                    </tr>
                </thead>
                <tbody id="tbody"></tbody>
            </table>
        </div>
    </div>
</body>
</html>
