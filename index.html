<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="indexCss.css">

    <script>
        const jsonUrl = 'https://prof-jwchi.github.io/kopo-front2026/Json/baseball.json';
        let jsonData = [];
        let team = "";

        fetch(jsonUrl)
        .then(response => {
            return response.json();
        })
        .then(data => {
            jsonData = data.list;
            console.log(jsonData);

            for(let i=0; i<jsonData.length; i++)
            {
                team =
                "<tr>"
                    + "<td class='td_rank'>" + jsonData[i].rank.rank + "</td>"
                    + "<td class='td_name'>" 
                        + "<div class='imgTeam'><img src='" + jsonData[i].imageUrl + "'></div>" 
                        + "<span class='txt_name'>" + jsonData[i].shortName + " > </span></td>"
                    + "<td>" + jsonData[i].rank.game + "</td>"
                    + "<td>" + jsonData[i].rank.win + "</td>"
                    + "<td>" + jsonData[i].rank.draw + "</td>"
                    + "<td>" + jsonData[i].rank.loss + "</td>"
                    + "<td class='selected_on'>" + jsonData[i].rank.wpct + "</td>"
                    + "<td>" + jsonData[i].rank.gb + "</td>"
                    + "<td>" + jsonData[i].rank.streak + "</td>"
                + "</tr>";

                document.getElementById("tbody").innerHTML += team;
            };
        })
        .catch(error => {
            console.error('json 파일 가져오기 실패', error)
        })
    </script>
</head>
<body>
    <div class="rank">
        <h4 class="rank_title">종합 순위</h4>
        <div class="rank_box">
            <div class="rank_table">
                <table class="table_list">
                    <caption class="ir_caption">순위 결과표</caption>
                    <colgroup>
                        <col class="col1">
                        <col class="col2">
                        <col>
                        <col>
                        <col>
                        <col>
                        <col>
                        <col>
                        <col>
                    </colgroup>
                    <thead>
                        <tr>
                            <th scope="col"><span class="txt_col">순위</span></th> 
                            <th scope="col" class="table_name"><span class="txt_col">팀</span></th>
                            <th scope="col"><span class="btn_sort">경기</span></th> 
                            <th scope="col"><span class="btn_sort">승</span></th> 
                            <th scope="col"><span class="btn_sort">무</span></th> 
                            <th scope="col"><span class="btn_sort">패</span></th>
                            <th scope="col"><span class="btn_sort sort_on">승률</span></th> 
                            <th scope="col"><span class="btn_sort">게임차</span></th> 
                            <th scope="col"><span class="btn_sort">연속</span></th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
